<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITz Me RedaY – Developer Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060f; --c1:#00f0ff; --c2:#7b5cff; --c3:#ff3cac;
    --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.14); --text:#eef2ff; --muted:#a3acd0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;display:flex;align-items:center;justify-content:center;padding:28px 16px}

  /* animated aurora background */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden}
  .aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 18s ease-in-out infinite}
  .aurora i:nth-child(1){background:var(--c2);top:-20%;left:-15%}
  .aurora i:nth-child(2){background:var(--c1);bottom:-25%;right:-15%;animation-delay:-6s}
  .aurora i:nth-child(3){background:var(--c3);top:35%;left:40%;width:35vmax;height:35vmax;opacity:.22;animation-delay:-12s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(8vmax,6vmax) scale(1.15)}66%{transform:translate(-6vmax,9vmax) scale(.9)}}
  canvas#fx{position:fixed;inset:0;z-index:1;pointer-events:none}

  /* card */
  .card{position:relative;z-index:2;width:100%;max-width:420px;padding:2px;border-radius:30px;background:conic-gradient(from var(--a,0deg),var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 6s linear infinite;box-shadow:0 30px 80px -20px rgba(123,92,255,.55);opacity:0;transform:translateY(30px) scale(.97);animation:spin 6s linear infinite,enter 1s .1s cubic-bezier(.2,.9,.3,1) forwards}
  @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
  @keyframes spin{to{--a:360deg}}
  @keyframes enter{to{opacity:1;transform:none}}
  .inner{border-radius:28px;background:linear-gradient(160deg,rgba(14,17,40,.94),rgba(8,9,24,.96));backdrop-filter:blur(20px);padding:34px 24px 26px;text-align:center}

  /* avatar */
  .avatar{position:relative;width:148px;height:148px;margin:0 auto 20px}
  .avatar::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1));animation:rot 5s linear infinite;filter:blur(1px)}
  .avatar::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(255,255,255,.25);animation:rot 14s linear infinite reverse}
  @keyframes rot{to{transform:rotate(360deg)}}
  .avatar img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #070918;background:#0d1030;animation:bob 4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .badge{position:absolute;z-index:3;right:4px;bottom:6px;width:30px;height:30px;border-radius:50%;background:#12d97f;border:4px solid #070918;display:grid;place-items:center;font-size:12px}
  .badge::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #12d97f;animation:ping 1.8s ease-out infinite}
  @keyframes ping{from{transform:scale(.9);opacity:.9}to{transform:scale(1.7);opacity:0}}

  h1{font-size:1.9rem;font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,var(--c1),#fff,var(--c3),var(--c2),var(--c1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  .role{margin-top:8px;font-size:.95rem;color:var(--muted);min-height:1.5em}
  .role b{color:var(--c1);font-weight:600}
  .cursor{display:inline-block;width:2px;height:1em;background:var(--c1);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 24px}
  .tags span{font-size:.72rem;padding:6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);color:#cfd6f5}

  /* buttons */
  .links{display:grid;gap:12px}
  .btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;text-decoration:none;color:var(--text);background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:1rem;text-align:left;transition:transform .25s,box-shadow .25s,border-color .25s;opacity:0;animation:up .7s forwards}
  .btn:nth-child(1){animation-delay:.7s}.btn:nth-child(2){animation-delay:.85s}.btn:nth-child(3){animation-delay:1s}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .btn::before{content:"";position:absolute;inset:0;background:var(--g);opacity:0;transition:opacity .3s}
  .btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .6s}
  .btn:hover,.btn:active{transform:translateY(-3px) scale(1.015);border-color:transparent;box-shadow:0 12px 30px -8px var(--s)}
  .btn:hover::before,.btn:active::before{opacity:1}
  .btn:hover::after{left:140%}
  .btn>*{position:relative;z-index:1}
  .ico{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--g);box-shadow:0 6px 16px -4px var(--s)}
  .ico svg{width:24px;height:24px;fill:#fff}
  .txt{flex:1;line-height:1.25}
  .txt small{display:block;font-weight:400;font-size:.76rem;opacity:.8}
  .arrow{opacity:.6;transition:transform .25s}
  .btn:hover .arrow{transform:translateX(4px)}
  .wa{--g:linear-gradient(135deg,#25d366,#128c7e);--s:rgba(37,211,102,.6)}
  .tg{--g:linear-gradient(135deg,#2aabee,#229ed9);--s:rgba(42,171,238,.6)}
  .call{--g:linear-gradient(135deg,#7b5cff,#ff3cac);--s:rgba(255,60,172,.55)}
  .call .ico{animation:ring 2.4s ease-in-out infinite}
  @keyframes ring{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-14deg)}72%{transform:rotate(14deg)}79%{transform:rotate(-10deg)}86%{transform:rotate(8deg)}}

  footer{margin-top:24px;font-size:.74rem;color:var(--muted)}
  footer span{color:var(--c3)}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<main class="card">

        <span class="txt">WhatsApp<small>Chat with me</small></span>

      </a>

<script>
  // typing effect
  (function(){
    var words=["Android Developer","Game Developer","App Creator","Problem Solver"],i=0,j=0,del=false,el=document.getElementById('typed');
    (function tick(){
      var w=words[i];
      el.textContent=w.slice(0,j);
      if(!del&&j===w.length){del=true;return setTimeout(tick,1400)}
      if(del&&j===0){del=false;i=(i+1)%words.length}
      j+=del?-1:1;
      setTimeout(tick,del?40:85);
    })();
  })();

  // floating particles
  (function(){
    var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,P=[],N=48,m={x:-999,y:-999};
    function size(){W=c.width=innerWidth;H=c.height=innerHeight}
    size();addEventListener('resize',size);
    addEventListener('pointermove',function(e){m.x=e.clientX;m.y=e.clientY});
    for(var k=0;k<N;k++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.8+.6});
    (function draw(){
      x.clearRect(0,0,W,H);
      for(var a=0;a<N;a++){
        var p=P[a];p.x+=p.vx;p.y+=p.vy;
        if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
        var dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
        if(d<110){p.x+=dx/d*1.2;p.y+=dy/d*1.2}
        x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle='rgba(0,240,255,.7)';x.fill();
        for(var b=a+1;b<N;b++){
          var q=P[b],l=Math.hypot(p.x-q.x,p.y-q.y);
          if(l<110){x.strokeStyle='rgba(123,92,255,'+(1-l/110)*.35+')';x.lineWidth=.6;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}
        }
      }
      requestAnimationFrame(draw);
    })();
  })();
</script>
